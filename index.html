<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D GPX Flyover</title>
    <!-- MapLibre -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Data Parsers -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
    <!-- NEW: Chart.js for the Line Graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        #controls { 
            position: absolute; top: 20px; left: 20px; z-index: 1; 
            background: rgba(0,0,0,0.85); padding: 20px; border-radius: 8px; 
            color: white; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .player-marker {
            width: 16px; height: 16px; background-color: white;
            border: 4px solid #ff9900; border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 153, 0, 1);
            opacity: 0; transition: opacity 0.5s;
        }

        #hud {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 2; background: rgba(15, 15, 20, 0.9); border-top: 3px solid #ff9900;
            padding: 20px 30px; border-radius: 16px; display: none; gap: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        /* NEW: Unified Bottom Panel for Graph and Timeline */
        #bottom-panel {
            position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 800px; z-index: 2;
            background: rgba(15, 15, 20, 0.9); padding: 15px 25px; border-radius: 16px;
            display: none; flex-direction: column; gap: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6); border: 1px solid #333;
        }

        #chart-container {
            width: 100%;
            height: 100px; /* Keep the chart short and sleek */
        }
        
        #timeline-container {
            display: flex; align-items: center; gap: 20px; width: 100%;
        }
        
        #play-pause-btn {
            background: #00ff88; color: black; border: none; border-radius: 50%;
            width: 45px; height: 45px; font-size: 18px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        #play-pause-btn:hover { background: #00cc6a; }
        
        #timeline { flex-grow: 1; cursor: pointer; accent-color: #ff9900; height: 6px; }

        .text-metric { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 80px; }
        .text-metric .val { font-size: 32px; font-weight: 800; color: white; font-variant-numeric: tabular-nums; }
        .text-metric .lbl { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }

        .gauge-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .gauge {
            width: 70px; height: 70px; border-radius: 50%; background: #222; 
            display: flex; align-items: center; justify-content: center; position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .gauge-inner {
            width: 58px; height: 58px; background: rgba(15, 15, 20, 1); border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2;
        }
        .gauge-val { font-size: 20px; font-weight: bold; color: white; line-height: 1; margin-top: 2px;}
        .gauge-lbl { font-size: 9px; color: #aaa; text-transform: uppercase; margin-top: 2px;}

        button.start-btn, input { background: #00ff88; color: black; border: none; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        button.start-btn:hover { background: #00cc6a; }
        input[type="file"] { background: white; font-weight: normal; }
    </style>
</head>
<body>
    <div id="controls">
        <label>1. Select your Strava GPX file:</label>
        <input type="file" id="gpxUpload" accept=".gpx">
        <button id="play" class="start-btn" style="display:none;">▶ Load 3D Flyover</button>
    </div>
    
    <!-- Unified Graph and Scrubber Panel -->
    <div id="bottom-panel">
        <div id="chart-container">
            <canvas id="telemetryChart"></canvas>
        </div>
        <div id="timeline-container">
            <button id="play-pause-btn">⏸</button>
            <input type="range" id="timeline" min="0" max="4000" value="0">
        </div>
    </div>

    <div id="hud">
        <div class="text-metric"><div class="val" id="hud-dist">0.0</div><div class="lbl">Miles</div></div>
        <div class="gauge-container"><div class="gauge" id="ring-speed" style="--color: #00ff88;"><div class="gauge-inner"><div class="gauge-val" id="val-speed">0</div><div class="gauge-lbl">MPH</div></div></div></div>
        <div class="gauge-container"><div class="gauge" id="ring-pwr" style="--color: #00aaff;"><div class="gauge-inner"><div class="gauge-val" id="val-pwr">0</div><div class="gauge-lbl">Watts</div></div></div></div>
        <div class="gauge-container"><div class="gauge" id="ring-hr" style="--color: #ff3366;"><div class="gauge-inner"><div class="gauge-val" id="val-hr">0</div><div class="gauge-lbl">BPM</div></div></div></div>
        <div class="gauge-container"><div class="gauge" id="ring-cad" style="--color: #ffcc00;"><div class="gauge-inner"><div class="gauge-val" id="val-cad">0</div><div class="gauge-lbl">RPM</div></div></div></div>
        <div class="text-metric"><div class="val" id="hud-ele">0</div><div class="lbl">Feet Elev</div></div>
    </div>

    <div id="map"></div>

    <script>
        const map = new maplibregl.Map({
            container: 'map', center: [-4.6, 57.1], zoom: 11, pitch: 65, bearing: -30,
            style: {
                version: 8,
                sources: {
                    'satellite': { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256 },
                    'terrainSource': { type: 'raster-dem', url: 'https://demotiles.maplibre.org/terrain-tiles/tiles.json', tileSize: 256 }
                },
                layers: [{ id: 'satellite-layer', type: 'raster', source: 'satellite' }],
                terrain: { source: 'terrainSource', exaggeration: 1.5 }
            }
        });

        let currentRoute = null; 
        let rawTelemetry = []; 
        let totalDistanceKm = 0;
        let originalTrackCoords = [];
        let cameraBearing = 0; 
        let playerMarker; 
        
        let isPlaying = false;
        let currentFrame = 0;
        const totalFrames = 4000;
        const timelineSlider = document.getElementById('timeline');
        timelineSlider.max = totalFrames;

        let telemetryChart = null;
        let currentPointIndex = 0;

        map.on('load', () => {
            map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }, lineMetrics: true });
            map.addLayer({
                id: 'route-line',
                type: 'line',
                source: 'route',
                paint: {
                    'line-width': 8,
                    'line-opacity': 0.9,
                    'line-gradient': ['interpolate', ['linear'], ['line-progress'], 0, '#ff9900', 1, '#00ff88']
                }
            });

            const el = document.createElement('div');
            el.className = 'player-marker';
            el.id = 'player-icon';
            playerMarker = new maplibregl.Marker({ element: el }).setLngLat([0, 0]).addTo(map);
        });

        document.getElementById('gpxUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const gpxText = event.target.result;
                const dom = new DOMParser().parseFromString(gpxText, 'text/xml');
                const trkpts = dom.getElementsByTagName('trkpt');
                rawTelemetry = [];
                
                for (let i = 0; i < trkpts.length; i++) {
                    const pt = trkpts[i];
                    const timeNode = pt.getElementsByTagName('time')[0];
                    const time = timeNode ? new Date(timeNode.textContent).getTime() : 0;
                    
                    const eleNode = pt.getElementsByTagName('ele')[0];
                    const ele = eleNode ? parseFloat(eleNode.textContent) : 0;

                    const hrNode = pt.getElementsByTagNameNS('*', 'hr')[0] || pt.getElementsByTagName('hr')[0];
                    const hr = hrNode ? parseInt(hrNode.textContent) : 0;
                    
                    const cadNode = pt.getElementsByTagNameNS('*', 'cad')[0] || pt.getElementsByTagName('cad')[0];
                    const cad = cadNode ? parseInt(cadNode.textContent) : 0;
                    
                    const pwrNode = pt.getElementsByTagNameNS('*', 'watts')[0] || pt.getElementsByTagName('watts')[0] || 
                                    pt.getElementsByTagNameNS('*', 'power')[0] || pt.getElementsByTagName('power')[0];
                    const power = pwrNode ? parseInt(pwrNode.textContent) : 0;

                    rawTelemetry.push({ time, hr, cad, power, ele, smoothedPower: power, smoothedCad: cad });
                }

                // NEW: Apply a 10-second Rolling Average to Power and Cadence
                const windowSize = 5; // 5 points backward, 5 points forward
                for (let i = 0; i < rawTelemetry.length; i++) {
                    let pSum = 0, cSum = 0, count = 0;
                    let start = Math.max(0, i - windowSize);
                    let end = Math.min(rawTelemetry.length - 1, i + windowSize);
                    
                    for (let j = start; j <= end; j++) {
                        pSum += rawTelemetry[j].power;
                        cSum += rawTelemetry[j].cad;
                        count++;
                    }
                    rawTelemetry[i].smoothedPower = Math.round(pSum / count);
                    rawTelemetry[i].smoothedCad = Math.round(cSum / count);
                }

                // Initialize the Chart
                if (telemetryChart) telemetryChart.destroy();
                const ctx = document.getElementById('telemetryChart').getContext('2d');
                
                telemetryChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: rawTelemetry.map((_, i) => i),
                        datasets: [
                            {
                                label: 'Power',
                                data: rawTelemetry.map(d => d.smoothedPower),
                                borderColor: '#00aaff',
                                borderWidth: 2,
                                pointRadius: 0, // Hides the individual dots for a smooth line
                                tension: 0.2,
                                yAxisID: 'yPower'
                            },
                            {
                                label: 'Heart Rate',
                                data: rawTelemetry.map(d => d.hr),
                                borderColor: '#ff3366',
                                borderWidth: 2,
                                pointRadius: 0,
                                tension: 0.2,
                                yAxisID: 'yHR'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false, // Turns off animations so the scrubber line stays fast
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { display: false },
                            tooltip: { enabled: false }
                        },
                        scales: {
                            x: { display: false },
                            yPower: { display: false, min: 0, max: 500 }, 
                            yHR: { display: false, min: 50, max: 200, position: 'right' }
                        }
                    },
                    plugins: [{
                        id: 'verticalLine',
                        afterDraw: chart => {
                            if (currentPointIndex >= 0) {
                                const x = chart.scales.x.getPixelForValue(currentPointIndex);
                                const ctx = chart.ctx;
                                ctx.save();
                                ctx.beginPath();
                                ctx.moveTo(x, chart.chartArea.top);
                                ctx.lineTo(x, chart.chartArea.bottom);
                                ctx.lineWidth = 2;
                                ctx.strokeStyle = '#ff9900';
                                ctx.stroke();
                                ctx.restore();
                            }
                        }
                    }]
                });

                const geojson = toGeoJSON.gpx(dom);
                let track = geojson.features.find(f => f.geometry.type === 'LineString' || f.geometry.type === 'MultiLineString');
                if (!track) return;
                
                if (track.geometry.type === 'MultiLineString') {
                    let flattened = [];
                    track.geometry.coordinates.forEach(segment => flattened.push(...segment));
                    track = turf.lineString(flattened);
                }
                
                originalTrackCoords = track.geometry.coordinates;
                totalDistanceKm = turf.length(track);

                const simplifiedTrack = turf.simplify(track, { tolerance: 0.0002, highQuality: true });
                currentRoute = turf.bezierSpline(simplifiedTrack);

                map.getSource('route').setData(currentRoute);
                
                const startPoint = turf.along(currentRoute, 0).geometry.coordinates;
                const startLookAhead = turf.along(currentRoute, 0.05).geometry.coordinates;
                cameraBearing = turf.bearing(turf.point(startPoint), turf.point(startLookAhead));
                
                map.fitBounds(turf.bbox(currentRoute), { padding: 50, pitch: 65, bearing: cameraBearing });
                document.getElementById('play').style.display = 'block';
            };
            reader.readAsText(file);
        });

        function updateGauge(id, value, maxVal, color) {
            document.getElementById(`val-${id}`).innerText = value;
            const pct = Math.min((value / maxVal) * 100, 100);
            document.getElementById(`ring-${id}`).style.background = `conic-gradient(${color} ${pct}%, #222 ${pct}%)`;
        }

        function renderFrame(frameIndex) {
            const lineDistance = turf.length(currentRoute);
            const progress = frameIndex / totalFrames;
            
            document.getElementById('hud-dist').innerText = (progress * totalDistanceKm * 0.621371).toFixed(1);
            const pointIndex = Math.floor(progress * (rawTelemetry.length - 1));
            const data = rawTelemetry[pointIndex] || { time: 0, hr: 0, cad: 0, power: 0, ele: 0, smoothedPower: 0, smoothedCad: 0 };
            
            // Sync Chart position
            currentPointIndex = pointIndex;
            if (telemetryChart) telemetryChart.update('none'); // Re-renders the vertical line instantly
            
            document.getElementById('hud-ele').innerText = Math.round(data.ele * 3.28084);
            
            // NEW: Use the smoothed values for the gauges
            updateGauge('pwr', data.smoothedPower, 400, '#00aaff'); 
            updateGauge('hr', data.hr, 190, '#ff3366');    
            updateGauge('cad', data.smoothedCad, 120, '#ffcc00');  

            let speedMph = 0;
            if (pointIndex < rawTelemetry.length - 3 && pointIndex < originalTrackCoords.length - 3) {
                const t1 = rawTelemetry[pointIndex].time;
                const t2 = rawTelemetry[pointIndex + 3].time; 
                if (t1 > 0 && t2 > 0) {
                    const distDiffKm = turf.distance(turf.point(originalTrackCoords[pointIndex]), turf.point(originalTrackCoords[pointIndex + 3]));
                    const hoursDiff = (t2 - t1) / 3600000;
                    if (hoursDiff > 0) speedMph = Math.round((distDiffKm / hoursDiff) * 0.621371);
                }
            }
            updateGauge('speed', speedMph, 30, '#00ff88');

            const currentDistance = progress * lineDistance;
            const currentPoint = turf.along(currentRoute, currentDistance).geometry.coordinates;
            const nextPoint = turf.along(currentRoute, Math.min(currentDistance + 0.05, lineDistance)).geometry.coordinates;
            
            playerMarker.setLngLat(currentPoint);

            const safeProgress = Math.max(0.001, Math.min(0.999, progress));
            map.setPaintProperty('route-line', 'line-gradient', [
                'interpolate', ['linear'], ['line-progress'], 0, '#ff9900', safeProgress, '#ff9900', safeProgress + 0.001, '#00ff88', 1, '#00ff88'
            ]);
            
            const targetBearing = turf.bearing(turf.point(currentPoint), turf.point(nextPoint));
            let angleDiff = targetBearing - cameraBearing;
            while (angleDiff > 180) angleDiff -= 360;
            while (angleDiff < -180) angleDiff += 360;
            
            if (isPlaying) {
                cameraBearing += angleDiff * 0.04; 
            } else {
                cameraBearing = targetBearing;
            }

            map.jumpTo({ center: currentPoint, bearing: cameraBearing, pitch: 75, zoom: 14 });
        }

        function animationLoop() {
            if (!isPlaying) return;
            
            if (currentFrame >= totalFrames) {
                isPlaying = false;
                document.getElementById('play-pause-btn').innerText = '▶';
                return;
            }
            
            renderFrame(currentFrame);
            timelineSlider.value = currentFrame; 
            
            currentFrame++;
            requestAnimationFrame(animationLoop);
        }

        document.getElementById('play').addEventListener('click', () => {
            if (!currentRoute) return;
            document.getElementById('controls').style.display = 'none'; 
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('bottom-panel').style.display = 'flex';
            document.getElementById('player-icon').style.opacity = '1'; 
            
            isPlaying = true;
            animationLoop();
        });

        document.getElementById('play-pause-btn').addEventListener('click', function() {
            isPlaying = !isPlaying;
            this.innerText = isPlaying ? '⏸' : '▶';
            if (isPlaying) animationLoop();
        });

        timelineSlider.addEventListener('input', function(e) {
            currentFrame = parseInt(e.target.value);
            renderFrame(currentFrame);
        });
    </script>
</body>
</html>
